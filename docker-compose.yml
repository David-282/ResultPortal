services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: resultportal
      POSTGRES_USER: resultportal_user
      POSTGRES_PASSWORD: resultportal_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      DB_NAME: resultportal
      DB_USER: resultportal_user
      DB_PASSWORD: resultportal_pass
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data:
